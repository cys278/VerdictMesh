name: Verify VerdictMesh package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade build pytest
      - name: Check package and tests
        run: |
          python -m pip install -e .
          python -m pytest -q
          python -m build
