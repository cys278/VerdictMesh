<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdictMesh | Document Audit</title>
    <link rel="stylesheet" href="style.css">
    <script>
        try {
            document.documentElement.dataset.theme =
                localStorage.getItem('verdictmesh-theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (_) {
            document.documentElement.dataset.theme = 'light';
        }
    </script>
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <img class="brand-mark" src="verdictmesh-mark.svg" alt="" aria-hidden="true">
            <span class="brand-name">VerdictMesh</span>
            <span class="brand-separator" aria-hidden="true"></span>
            <span class="header-title">Document Audit</span>
        </div>
        <div class="header-actions">
            <span class="header-kicker">Parallel analysis workspace</span>
            <button id="theme-toggle" class="theme-toggle" type="button"
                    aria-label="Switch color theme" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☾</span>
                <span class="theme-label">Dark</span>
            </button>
        </div>
    </header>

    <main>
        <div id="left-panel">
            <div class="left-panel-header">
                <div id="agent-legend" class="legend-container" style="display: none;"></div>
            </div>
            <div id="document-content"></div>
        </div>

        <div id="right-panel">
            <div id="drop-zone" role="button" tabindex="0"
                 aria-label="Choose a PDF document">
                <h3 class="drop-title">Upload Document</h3>
                <p class="drop-subtitle">
                    Drag &amp; drop a dense PDF lease or contract here to begin the multi-agent audit.
                </p>
                <input type="file" id="file-input" accept=".pdf">
            </div>

            <div id="controls">
                <button id="dispatch-btn" class="primary">Dispatch Parallel Agents</button>
            </div>

            <div id="feed"></div>
        </div>

        <div id="insight-tooltip" class="insight-tooltip"></div>
    </main>

    <script src="theme.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
